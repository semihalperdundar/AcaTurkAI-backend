# Anaconda/conda ortami - VS Code'da bu projeyi calistirmak icin.
# Kurulum:  conda env create -f environment.yml
# Guncelleme: conda env update -f environment.yml --prune
# Aktiflestirme: conda activate acaturkai
name: acaturkai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # WeasyPrint conda-forge'dan: Pango/HarfBuzz/fontconfig DLL'leri (Windows dahil) birlikte gelir.
  # Surumler requirements.txt ile ayni -> pip adimi bunlari yeniden kurmaz.
  - weasyprint=62.3
  - jinja2=3.1.4
  - pip:
      - -r requirements.txt
