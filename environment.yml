# Anaconda/conda ortami - VS Code'da bu projeyi calistirmak icin.
# Kurulum:  conda env create -f environment.yml
# Guncelleme: conda env update -f environment.yml --prune
# Aktiflestirme: conda activate acaturkai
name: acaturkai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # WeasyPrint'in sistem kutuphaneleri (Pango/HarfBuzz/fontconfig DLL'leri, Windows dahil).
  # WeasyPrint'in kendisi requirements.txt'ten pip ile kurulur: conda-forge'da 63.0 yok
  # (62.3 -> 65.1), 62.3 ise pydyf>=0.12 ile kirik (CI: 'super' object has no attribute 'transform').
  - pango=1.58
  - pip:
      - -r requirements.txt
