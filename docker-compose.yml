services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: acaturkai
      POSTGRES_PASSWORD: acaturkai
      POSTGRES_DB: acaturkai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acaturkai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://acaturkai:acaturkai@db:5432/acaturkai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://acaturkai:acaturkai@db:5432/acaturkai
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

volumes:
  db_data:
